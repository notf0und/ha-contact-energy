name: "Bug report"
description: "Wrong values, errors, or a plan that isn't handled correctly"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search the [existing issues](https://github.com/notf0und/ha-contact-energy/issues?q=is%3Aissue) first.

        The **diagnostics file is the most useful thing you can attach**: it contains fresh responses from the Contact Energy API, so the problem can be investigated without access to your account. Email, password, addresses, ICP and meter serial numbers are removed from it.
  - type: input
    attributes:
      label: "Version"
      description: "Integration version (HACS, or `version` in `manifest.json`)."
      placeholder: "1.1.2"
    validations:
      required: true
  - type: input
    attributes:
      label: "Plan"
      description: "Your Contact Energy plan, as shown by the *Plan* sensor or in the app."
      placeholder: "Good Nights (Monday - Friday)"
    validations:
      required: true
  - type: textarea
    attributes:
      label: "What happens"
      description: "Which entity or statistic is wrong, and what does it show?"
    validations:
      required: true
  - type: textarea
    attributes:
      label: "What you expected"
      description: "e.g. the value the Contact Energy app or your bill shows for the same day or period."
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Diagnostics"
      description: |
        Settings → Devices & services → Contact Energy → open the **Electricity** (or **Gas**) device → ⋮ menu → **Download diagnostics**, then drag the file here.
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Logs"
      description: |
        Optional: errors from Settings → System → Logs, or debug logs (see the README's *Reporting issues* section).
      render: text
