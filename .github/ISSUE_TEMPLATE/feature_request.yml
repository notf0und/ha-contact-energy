name: "Feature request"
description: "Suggest an idea or a new sensor"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Please search the [existing issues](https://github.com/notf0und/ha-contact-energy/issues?q=is%3Aissue) first.
  - type: textarea
    attributes:
      label: "What would you like?"
      description: "What problem would it solve for you?"
    validations:
      required: true
  - type: input
    attributes:
      label: "Plan"
      description: "Your Contact Energy plan, if the request depends on it."
  - type: textarea
    attributes:
      label: "Additional context"
      description: "Screenshots, what the Contact Energy app shows, a diagnostics file, ..."
